<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Toki</title>
    <link rel="stylesheet" href="css/styles.css?v=40"></head>
<body>
    <!-- Login/Signup Screen -->
    <div id="authScreen" class="screen active">
        <div class="auth-box">
            <img src="logo.svg" alt="Logo" style="width:64px;height:64px;margin-bottom:1rem;">
            <h1>Toki</h1>
            <p class="subtitle">Secure peer-to-peer messaging</p>

            <div id="loginForm">
                <input type="text" id="authUsername" placeholder="Display name" autocomplete="off">
                <input type="password" id="authPassword" placeholder="Password">
                <button id="loginBtn">Sign In</button>
                <button id="createBtn" class="secondary-btn">Create Account</button>
            </div>

            <div class="auth-actions">
                <button id="importBtn" class="link-btn">Import Identity</button>
                <input type="file" id="importInput" accept=".json" hidden>
            </div>
        </div>
    </div>

    <!-- Main Chat Screen -->
    <div id="chatScreen" class="screen">
        <div class="app-layout">
            <!-- Sidebar -->
            <aside class="sidebar">
                <div class="sidebar-header">
                    <div class="user-info">
                        <span class="user-avatar" id="myAvatar"></span>
                        <span class="user-name" id="myName"></span>
                    </div>
                    <div class="sidebar-actions">
                        <button id="newChatBtn" title="New Chat">+</button>
                        <button id="settingsBtn" title="Settings">⚙</button>
                    </div>
                </div>
                <div class="online-section">
                    <div class="online-header">Online Users <span id="onlineCount">0</span></div>
                    <div class="online-list" id="onlineList"></div>
                </div>
                <div class="chat-list" id="chatList"></div>
                <div class="call-history" id="callHistory" style="display:none;"></div>
                <div class="bottom-nav" id="bottomNav">
                    <button class="bottom-nav-btn active" data-view="chats">💬 Chats</button>
                    <button class="bottom-nav-btn" data-view="calls">📞 Calls</button>
                </div>
            </aside>

            <!-- Chat Area -->
            <div class="chat-area">
                <div class="chat-header" id="chatHeader">
                    <span class="chat-title">Select or start a chat</span>
                </div>
                <div class="messages" id="messages"></div>
                <div class="message-input" id="messageInputArea" hidden>
                    <button id="emojiBtn" title="Emoji">😊</button>
                    <button id="animBtn" title="Send Animation">🎁</button>
                    <button id="attachBtn" title="Send image/video">📎</button>
                    <input type="file" id="attachInput" accept="image/*,video/*" hidden>
                    <button id="locationBtn" title="Share location">📍</button>
                    <input type="text" id="messageText" placeholder="Type a message..." autocomplete="off">
                    <button id="sendBtn">Send</button>
                </div>
                <div class="nav-input" id="navInputArea">
                    <button class="nav-input-btn active" data-view="chats">💬 Chats</button>
                    <button class="nav-input-btn" data-view="calls">📞 Calls</button>
                </div>
            </div>
        </div>
    </div>

    <!-- New Chat Modal -->
    <div id="newChatModal" class="modal" hidden>
        <div class="modal-content">
            <h2>New Chat</h2>
            <div class="modal-tabs">
                <button class="modal-tab active" data-target="joinTab">Join Group</button>
                <button class="modal-tab" data-target="createTab">Create Group</button>
            </div>
            <div class="modal-tab-content active" id="joinTab">
                <input type="text" id="joinRoomCode" placeholder="Enter group code">
                <button id="joinRoomBtn">Join</button>
            </div>
            <div class="modal-tab-content" id="createTab">
                <input type="text" id="newRoomName" placeholder="Group name (e.g., Team Chat)">
                <label><input type="checkbox" id="isGroupChat"> Group chat</label>
                <button id="createRoomBtn">Create</button>
                <div id="roomCodeDisplay" hidden>
                    <p>Share this code with others:</p>
                    <div class="room-code" id="generatedCode"></div>
                    <button id="copyCodeBtn">Copy Code</button>
                </div>
            </div>
            <button class="modal-close" id="closeNewChat">&times;</button>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal" hidden>
        <div class="modal-content">
            <h2>Settings</h2>
            <div class="settings-section">
                <h3>Profile</h3>
                <div class="profile-pic-section">
                    <div class="profile-pic-preview" id="profilePicPreview"></div>
                    <button id="uploadPicBtn" type="button">Upload Photo</button>
                    <input type="file" id="profilePicInput" accept="image/*" hidden>
                </div>
                <div class="profile-fields">
                    <label>First Name<input type="text" id="profileFirstName" placeholder="First name"></label>
                    <label>Last Name<input type="text" id="profileLastName" placeholder="Last name"></label>
                    <label>Nickname<input type="text" id="profileNickname" placeholder="Nickname (displayed to others)"></label>
                    <label class="profile-toggle">
                        <input type="checkbox" id="profileShowLastSeen" checked>
                        Show "last seen" to others
                    </label>
                </div>
                <button id="saveProfileBtn" type="button">Save Profile</button>
            </div>
            <div class="settings-section">
                <h3>Theme</h3>
                <div class="theme-options">
                    <button class="theme-btn" data-theme="default">🎨 Default</button>
                    <button class="theme-btn" data-theme="light">☀️ Light</button>
                    <button class="theme-btn" data-theme="dark">🌙 Dark</button>
                    <button class="theme-btn" data-theme="basketball">🏀 Basketball</button>
                    <button class="theme-btn" data-theme="hitech">🤖 Hi-Tech</button>
                    <button class="theme-btn" data-theme="chinese">🏮 Chinese</button>
                    <button class="theme-btn" data-theme="bluedog">🐕 Blue Dog</button>
                    <button class="theme-btn" data-theme="elmwood">🦅 Elmwood</button>
                </div>
            </div>
            <div class="settings-section">
                <h3>Identity</h3>
                <p class="settings-info">Your ID: <code id="myPeerId"></code></p>
                <button id="exportIdentityBtn">Export Identity (Backup)</button>
            </div>
            <div class="settings-section">
                <h3>Account</h3>
                <button id="logoutBtn" class="danger-btn">Sign Out</button>
            </div>
            <button class="modal-close" id="closeSettings">&times;</button>
        </div>
    </div>

    <!-- Video Call Screen -->
    <div id="callScreen" class="call-screen">
        <div class="call-videos">
            <video id="remoteVideo" autoplay playsinline></video>
            <video id="localVideo" autoplay playsinline muted></video>
        </div>
        <div class="call-info" id="callInfo"></div>
        <div class="call-controls">
            <button id="toggleMicBtn" class="call-ctrl-btn">🎤</button>
            <button id="toggleCamBtn" class="call-ctrl-btn">📷</button>
            <button id="switchCamBtn" class="call-ctrl-btn">🔄</button>
            <button id="hangupBtn" class="call-ctrl-btn hangup">📵</button>
        </div>
    </div>

    <!-- Incoming Call Modal -->
    <div id="incomingCall" class="incoming-call" hidden>
        <div class="incoming-call-content">
            <p class="incoming-caller" id="incomingCaller"></p>
            <p class="incoming-type" id="incomingType"></p>
            <div class="incoming-actions">
                <button id="acceptCallBtn" class="call-accept">Accept</button>
                <button id="declineCallBtn" class="call-decline">Decline</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="js/crypto.js?v=17"></script>
    <script src="js/storage.js?v=17"></script>
    <script src="js/presence.js?v=18"></script>
    <script src="js/peer.js?v=19"></script>
    <script src="js/app.js?v=45"></script>
</body>
</html>
